name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No step pipes a check into another command: a pipeline takes its exit code
# from the last stage, which is how a lint failure can pass silently.
jobs:
  python:
    name: Agent + CLI (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No submodule: these tests stub the runtime. The integration job below
      # is the one that builds a daemon and talks to it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: PYTHONPATH=cli:apps/agent python -m unittest discover -s tests -t .

  integration:
    name: Agent against a real Kura daemon
    # Every wire-level bug in this stack -- a rejected URL shape, a route that
    # needs a bearer token, a token that authenticates but resolves to no
    # tenant -- passed the mocked tests and failed here. Without this job CI
    # cannot see the class of failure that actually ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/workbench/vendor/kura/crates
      # A debug daemon, not the release sidecar: these tests exercise the
      # protocol, and the dev profile compiles several times faster.
      - name: Build the Kura daemon
        run: cargo build -p kura-cli --manifest-path apps/workbench/vendor/kura/crates/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `requires_kura` skips when no binary is found, and a skipped suite
      # still reports success. Fail here instead, so a broken build cannot
      # quietly turn this job into a no-op.
      - name: Require a discoverable daemon binary
        env:
          LOOPFORGE_KURA_BIN: ${{ github.workspace }}/apps/workbench/vendor/kura/crates/target/debug/kura
        run: PYTHONPATH=cli:apps/agent python -c "import sys; from tests.support.kura_daemon import kura_binary; sys.exit(0 if kura_binary() else 'no Kura binary was discoverable')"
      - name: Integration tests
        env:
          LOOPFORGE_KURA_BIN: ${{ github.workspace }}/apps/workbench/vendor/kura/crates/target/debug/kura
        run: PYTHONPATH=cli:apps/agent python -m unittest tests.agent.test_integration -v

  engine:
    name: Engine adapter against a real Godot
    # run_engine had no test coverage at all while already being reachable from
    # a button in the Workbench, and the only Godot-related test substituted a
    # shell script that echoed a version string. The adapter's actual contract
    # with the engine is only observable against a real binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Godot ships as a single binary, so this is an unzip rather than an
      # install. Pinned: a version bump should be a visible change here, not a
      # silent difference in what the adapter was tested against.
      - name: Install Godot 4
        run: |
          curl -sSLo godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p "$HOME/.local/bin"
          mv Godot_v4.3-stable_linux.x86_64 "$HOME/.local/bin/godot4"
          chmod +x "$HOME/.local/bin/godot4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # requires_godot skips when no usable binary is found, and a skipped suite
      # still reports success. Fail here instead, so a broken download cannot
      # quietly turn this job into a no-op that reports green.
      - name: Require a discoverable engine
        run: PYTHONPATH=cli:apps/agent python -c "import sys; from tests.support.godot import godot_binary, godot_major_version; b = godot_binary(); sys.exit('no Godot binary was discoverable') if b is None else None; v = godot_major_version(b); sys.exit(f'Godot major version {v} is not the supported 4') if v != 4 else None"
      - name: Engine integration tests
        run: PYTHONPATH=cli:apps/agent python -m unittest tests.cli.test_engine_integration -v

  workbench:
    name: Workbench (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/workbench/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build
      - name: Test
        run: pnpm test

  desktop:
    name: Desktop shell (Rust)
    # macOS matches the shipped target and needs no GUI system packages for a
    # check build.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/workbench/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/workbench/src-tauri
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test
