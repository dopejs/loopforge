[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loopforge"
version = "0.1.0a1"
description = "Independent local game-development agent with deterministic workflow tooling"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Loopforge contributors" }
]
license = "Apache-2.0"
dependencies = []

[project.scripts]
loopforge = "loopforge.cli:main"
loopforge-agent = "loopforge_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["cli/loopforge", "apps/agent/loopforge_agent"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "loopforge/_bundled_skills"
"contracts" = "loopforge/_contracts"

[tool.hatch.build.targets.sdist]
include = [
  "/cli",
  "/apps/agent",
  "/contracts",
  "/docs",
  "/skills",
  "/tests",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/pyproject.toml"
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
