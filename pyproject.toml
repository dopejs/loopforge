[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loopforge"
version = "0.1.0a1"
description = "Deterministic project state and evidence CLI for agent-assisted game development"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Loopforge contributors" }
]
dependencies = []

[project.scripts]
loopforge = "loopforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cli/loopforge"]

[tool.hatch.build.targets.sdist]
include = [
  "/cli",
  "/docs",
  "/skills",
  "/tests",
  "/README.md",
  "/pyproject.toml"
]
