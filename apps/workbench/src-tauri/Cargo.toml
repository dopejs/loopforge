[package]
name = "loopforge-workbench"
version = "0.1.0-alpha.1"
description = "Native Loopforge game development workbench"
authors = ["Loopforge contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "loopforge_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
ureq = { version = "2", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
