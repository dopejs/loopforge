[package]
name = "loopforge-workbench"
version = "0.1.0-alpha.1"
description = "Native Loopforge game development workbench"
authors = ["Loopforge contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "loopforge_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
# Bundled rather than linked against the system library: the shell reads the
# user store before any Agent exists, and a desktop build cannot depend on the
# host having a usable SQLite.
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

# Signalling the Agent on quit. The Agent stops its Kura daemon from a signal
# handler, so ending it politely is what stops the daemon too.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
